<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Discord Method B 인터랙티브 테스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 디스코드 액티비티 CSP 환경에서도 외부 CDN 없이 100% 완벽히 뜨는 자체 독립 스타일 */
    *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .min-h-screen { min-height: 100vh; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .p-6 { padding: 1.5rem; }
    .max-w-md { max-width: 28rem; }
    .w-full { width: 100%; }
    .bg-slate-800 { background-color: #1e293b; }
    .border { border-width: 1px; border-style: solid; }
    .border-indigo-500\/40 { border-color: rgba(99, 102, 241, 0.4); }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .p-8 { padding: 2rem; }
    .p-4 { padding: 1rem; }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .text-center { text-align: center; }
    .text-5xl { font-size: 3rem; line-height: 1; }
    .mb-4 { margin-bottom: 1rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .font-bold { font-weight: 700; }
    .text-indigo-400 { color: #818cf8; }
    .mb-2 { margin-bottom: 0.5rem; }
    .text-slate-300 { color: #cbd5e1; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .bg-slate-900\/80 { background-color: rgba(15, 23, 42, 0.8); }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-slate-400 { color: #94a3b8; }
    .mb-1 { margin-bottom: 0.25rem; }
    .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
    .font-extrabold { font-weight: 800; }
    .text-emerald-400 { color: #34d399; }
    .my-2 { margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .gap-2 { gap: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .bg-indigo-600 { background-color: #4f46e5; color: #ffffff; }
    .hover\:bg-indigo-500:hover, .bg-indigo-600:hover { background-color: #6366f1; }
    .bg-emerald-600 { background-color: #059669; color: #ffffff; }
    .hover\:bg-emerald-500:hover, .bg-emerald-600:hover { background-color: #10b981; }
    .bg-rose-600 { background-color: #e11d48; color: #ffffff; }
    .hover\:bg-rose-500:hover, .bg-rose-600:hover { background-color: #f43f5e; }
    .font-semibold { font-weight: 600; }
    .transition { transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1); }
    .text-slate-500 { color: #64748b; }
    strong { color: #ffffff; }
    button {
      cursor: pointer;
      border: none;
      outline: none;
    }
    code {
      font-family: monospace;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #e2e8f0;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .floating { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-800 border border-indigo-500/40 rounded-2xl p-8 shadow-2xl text-center">
    <div class="text-5xl mb-4 floating">🚀</div>
    <h1 class="text-2xl font-bold text-indigo-400 mb-2">Method B 렌더링 성공!</h1>
    <p class="text-slate-300 text-sm mb-6">
      이 화면은 외부 웹 호스팅 없이 <strong>Discord CDN + iframe.srcdoc</strong> 방식으로 실행되고 있습니다.
    </p>

    <div class="bg-slate-900/80 rounded-xl p-4 mb-6">
      <div class="text-xs text-slate-400 mb-1">인터랙티브 JS 카운터 테스트</div>
      <div id="counter" class="text-4xl font-extrabold text-emerald-400 my-2">0</div>
      <div class="flex gap-2 justify-center mt-3">
        <button id="btn-add-1" onclick="updateCount(1)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold text-sm transition">
          +1 증가
        </button>
        <button id="btn-add-10" onclick="updateCount(10)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold text-sm transition">
          +10 점프
        </button>
        <button id="btn-reset" onclick="resetCount()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 rounded-lg font-semibold text-sm transition">
          초기화
        </button>
      </div>
    </div>

    <div class="text-xs text-slate-500">
      이 파일(<code>sample_test.html</code>)을 디스코드 채팅방에 드래그해서 올려보세요!
    </div>
  </div>

  <script>
    let count = 0;
    function updateCount(delta) {
      count += delta;
      const counterEl = document.getElementById('counter');
      if (counterEl) counterEl.innerText = count.toLocaleString();
    }
    function resetCount() {
      count = 0;
      const counterEl = document.getElementById('counter');
      if (counterEl) counterEl.innerText = '0';
    }

    // 디스코드 액티비티 CSP 환경에서도 100% 안전하게 동작하도록 addEventListener로 바인딩
    document.getElementById('btn-add-1')?.addEventListener('click', () => updateCount(1));
    document.getElementById('btn-add-10')?.addEventListener('click', () => updateCount(10));
    document.getElementById('btn-reset')?.addEventListener('click', () => resetCount());
  </script>
</body>
</html>
